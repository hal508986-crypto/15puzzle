<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Image 15 Puzzle</title>
    <style>
        body {
            touch-action: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #2c3e50;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            color: #ecf0f1;
        }

        #ui-container {
            margin-bottom: 20px;
            text-align: center;
        }

        #file-input {
            display: none;
        }

        .btn {
            background-color: #3498db;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: inline-block;
            transition: background-color 0.2s;
        }

        .btn:active {
            background-color: #2980b9;
            transform: scale(0.95);
        }

        #puzzle-board {
            display: none;
            /* 初期状態は写真選択前のため非表示 */
            grid-template-columns: repeat(4, 1fr);
            gap: 2px;
            /* 画像の繋がりを見やすくするため隙間を狭く設定 */
            width: 90vw;
            max-width: 400px;
            aspect-ratio: 1;
            background-color: #34495e;
            padding: 4px;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .tile {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ecf0f1;
            border-radius: 4px;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s ease-in-out;
            background-size: 400% 400%;
            /* 4x4のグリッドに合わせて画像を拡大 */
            color: rgba(255, 255, 255, 0.6);
            /* ヒントの数字を半透明の白で表示 */
            font-size: 1.5rem;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
            /* 背景画像と同化しないよう影を付与 */
        }

        .tile:active {
            transform: scale(0.95);
        }

        .empty {
            background: none !important;
            box-shadow: none;
            cursor: default;
        }
    </style>
</head>

<body>

    <div id="ui-container">
        <h2>オリジナル画像パズル</h2>
        <label for="file-input" class="btn">写真を選ぶ</label>
        <input type="file" id="file-input" accept="image/*">
        <p style="font-size: 0.8rem; margin-top: 15px; color: #95a5a6;">※写真はデバイス内で処理され、<br>サーバーには送信されません。</p>
    </div>

    <div id="puzzle-board"></div>

    <script>
        const board = document.getElementById('puzzle-board');
        const fileInput = document.getElementById('file-input');
        const uiContainer = document.getElementById('ui-container');
        let tiles = [];
        const size = 4;
        let imageUrl = '';

        // 写真が選択された際の処理
        fileInput.addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (!file) return;

            // ブラウザのメモリ上に画像URLを一時的に生成（外部送信はされません）
            imageUrl = URL.createObjectURL(file);

            // UIを切り替え
            uiContainer.style.display = 'none';
            board.style.display = 'grid';

            init();
        });

        function init() {
            tiles = Array.from({ length: size * size - 1 }, (_, i) => i + 1);
            tiles.push(0);
            shuffle();
            render();
        }

        function shuffle() {
            for (let i = 0; i < 1000; i++) {
                const emptyIdx = tiles.indexOf(0);
                const validMoves = getValidMoves(emptyIdx);
                const randomMove = validMoves[Math.floor(Math.random() * validMoves.length)];
                [tiles[emptyIdx], tiles[randomMove]] = [tiles[randomMove], tiles[emptyIdx]];
            }
        }

        function getValidMoves(emptyIdx) {
            const moves = [];
            const row = Math.floor(emptyIdx / size);
            const col = emptyIdx % size;

            if (row > 0) moves.push(emptyIdx - size);
            if (row < size - 1) moves.push(emptyIdx + size);
            if (col > 0) moves.push(emptyIdx - 1);
            if (col < size - 1) moves.push(emptyIdx + 1);

            return moves;
        }

        function render() {
            board.innerHTML = '';
            tiles.forEach((t, index) => {
                const tileEl = document.createElement('div');
                tileEl.className = 'tile' + (t === 0 ? ' empty' : '');

                if (t !== 0) {
                    // 背景に選択した写真を設定
                    tileEl.style.backgroundImage = `url(${imageUrl})`;

                    // 本来の正しい位置から、表示すべき画像の部分（background-position）を計算
                    const originalIndex = t - 1;
                    const row = Math.floor(originalIndex / size);
                    const col = originalIndex % size;

                    const xPos = (col / (size - 1)) * 100;
                    const yPos = (row / (size - 1)) * 100;

                    tileEl.style.backgroundPosition = `${xPos}% ${yPos}%`;

                    // ヒントとして数字を描画
                    tileEl.textContent = t;
                }

                tileEl.addEventListener('click', () => move(index));
                board.appendChild(tileEl);
            });

            setTimeout(checkWin, 50);
        }

        function move(index) {
            const emptyIdx = tiles.indexOf(0);
            if (getValidMoves(emptyIdx).includes(index)) {
                [tiles[index], tiles[emptyIdx]] = [tiles[emptyIdx], tiles[index]];
                render();
            }
        }

        function checkWin() {
            const isWin = tiles.slice(0, -1).every((t, i) => t === i + 1) && tiles[15] === 0;
            if (isWin) {
                alert('パズルクリア！！');

                // 次のプレイに備えてメモリを解放し、初期画面に戻す
                URL.revokeObjectURL(imageUrl);
                board.style.display = 'none';
                uiContainer.style.display = 'block';
                fileInput.value = '';
            }
        }
    </script>

</body>

</html>
